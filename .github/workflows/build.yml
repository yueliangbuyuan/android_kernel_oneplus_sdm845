name: Build ReSukiSU SUSFS 2.3 fajita Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio flex git libelf-dev libssl-dev \
            python3 rsync wget xz-utils gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Clone exact successful kernel baseline
        run: |
          set -e
          rm -rf kernel ReSukiSU
          git clone --filter=blob:none --no-checkout https://github.com/Terminator-J/crdroid_kernel_oneplus_sdm845.git kernel
          cd kernel
          git fetch --depth=1 origin eff9f6da3
          git checkout --detach eff9f6da3
          echo "Kernel commit:"
          git rev-parse HEAD

      - name: Clone exact ReSukiSU baseline
        run: |
          set -e
          git clone --filter=blob:none --no-checkout https://github.com/ReSukiSU/ReSukiSU.git ReSukiSU
          cd ReSukiSU
          git fetch --depth=1 origin 6803643
          git checkout --detach 6803643
          echo "ReSukiSU commit:"
          git rev-parse HEAD

      - name: Restore exact successful patches
        shell: bash
        run: |
          set -e
          mkdir -p patches

          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path

          patches = {
              "kernel.patch": """""",
              "resukisu.patch": """""",
          }

          for name, data in patches.items():
              Path("patches/" + name).write_bytes(gzip.decompress(base64.b64decode(data)))
              print(name, Path("patches/" + name).stat().st_size, "bytes")
          PY

      - name: Apply exact successful ReSukiSU patch
        run: |
          set -e
          cd ReSukiSU
          git apply --check ../patches/resukisu.patch
          git apply ../patches/resukisu.patch
          git diff --check
          echo "ReSukiSU patch applied."

      - name: Apply exact successful OnePlus SUSFS patch
        run: |
          set -e
          cd kernel
          git apply --check ../patches/kernel.patch
          git apply ../patches/kernel.patch
          git diff --check
          echo "Kernel patch applied."

          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../../ReSukiSU/kernel"

      - name: Configure exact successful kernel
        working-directory: kernel
        run: |
          set -e

          rm -rf out
          mkdir -p out

          make O=out ARCH=arm64 vendor/enchilada_defconfig

          ./scripts/config --file out/.config \
            --enable KSU \
            --enable KSU_SUSFS \
            --disable KSU_MANUAL_HOOK \
            --disable KSU_TRACEPOINT_HOOK \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SUS_MAP \
            --disable KSU_SUSFS_SUS_SU \
            --enable ONEPLUS_FASTCHG \
            --enable FG_BQ27541 \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --disable KPROBES \
            --enable OVERLAY_FS \
            --enable LTO_NONE \
            --disable LTO_CLANG \
            --disable THINLTO \
            --disable CFI_CLANG \
            --disable CFI_CLANG_SHADOW \
            --disable SHADOW_CALL_STACK

          make O=out ARCH=arm64 olddefconfig

          echo "===== FINAL CONFIG ====="
          grep -E '^(CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_TRACEPOINT_HOOK|CONFIG_KSU_SUSFS_|CONFIG_ONEPLUS_FASTCHG=|CONFIG_FG_BQ27541=|CONFIG_LTO_|CONFIG_THINLTO|CONFIG_CFI_CLANG|CONFIG_SHADOW_CALL_STACK|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=|CONFIG_KPROBES|CONFIG_OVERLAY_FS=)' out/.config || true

          test "$(grep -c '^CONFIG_KSU=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_KSU_SUSFS=y$' out/.config)" -eq 1
          ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config
          ! grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y' out/.config
          test "$(grep -c '^CONFIG_ONEPLUS_FASTCHG=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_FG_BQ27541=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_LTO_NONE=y$' out/.config)" -eq 1

      - name: Install LLVM 22.1.8
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/toolchains"
          cd "$GITHUB_WORKSPACE/toolchains"

          wget -q --show-progress \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-Linux-X64.tar.xz

          tar -xf LLVM-22.1.8-Linux-X64.tar.xz
          LLVM_DIR="$GITHUB_WORKSPACE/toolchains/LLVM-22.1.8-Linux-X64"

          echo "$LLVM_DIR/bin" >> "$GITHUB_PATH"

          "$LLVM_DIR/bin/clang" --version
          "$LLVM_DIR/bin/ld.lld" --version

      - name: Build exact target
        working-directory: kernel
        env:
          TMPDIR: /home/runner/work/kernel-tmp
          LLVM_DIR: /home/runner/work/toolchains/LLVM-22.1.8-Linux-X64
        run: |
          set -e
          mkdir -p "$TMPDIR"

          export PATH="$LLVM_DIR/bin:$PATH"

          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu-

      - name: Verify exact output
        working-directory: kernel
        run: |
          set -e

          test -f out/arch/arm64/boot/Image.gz-dtb

          echo "===== SUCCESS ====="
          ls -lh out/arch/arm64/boot/Image.gz-dtb

          echo
          echo "===== CONFIG ====="
          grep -E '^(CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_TRACEPOINT_HOOK|CONFIG_ONEPLUS_FASTCHG=|CONFIG_FG_BQ27541=|CONFIG_LTO_NONE=)' out/.config

          echo
          echo "===== VERSION ====="
          strings out/arch/arm64/boot/Image.gz-dtb | grep -E 'Linux version|clang version|ReSukiSU|SUSFS' | head -30 || true

      - name: Package artifact
        working-directory: kernel
        run: |
          set -e
          mkdir -p release
          cp out/arch/arm64/boot/Image.gz-dtb release/Image.gz-dtb
          cp out/.config release/kernel.config

          cat > release/README.txt <<'EOF'
          OnePlus 6T fajita
          Linux 4.19.325
          ReSukiSU v4.1.x
          SUSFS 2.3.0 Inline Hook
          Base: Terminator-J/crdroid_kernel_oneplus_sdm845 eff9f6da3
          Defconfig: vendor/enchilada_defconfig
          EOF

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-SUSFS-2.3-fajita
          path: kernel/release/
          if-no-files-found: error
