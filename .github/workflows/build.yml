name: Build ReSukiSU fajita Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    # ============================================================
    # Checkout kernel
    # ============================================================

    - name: Checkout kernel
      uses: actions/checkout@v4


    # ============================================================
    # Install build packages
    # ============================================================

    - name: Install packages
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex make gcc g++ \
          libssl-dev libelf-dev \
          python3 cpio rsync unzip


    # ============================================================
    # Install Android Clang
    # ============================================================

    - name: Install Android Clang
      run: |
        git clone --depth=1 \
          https://github.com/kdrag0n/proton-clang.git clang
        chmod +x clang/bin/*


    # ============================================================
    # Restore previous kernel build cache
    # ============================================================

    - name: Restore kernel build cache
      uses: actions/cache/restore@v4
      with:
        path: out
        key: kernel-build-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          kernel-build-${{ runner.os }}-${{ github.ref_name }}-


    # ============================================================
    # Clone ReSukiSU
    # ============================================================

    - name: Clone ReSukiSU
      run: |
        git clone --depth=1 \
          https://github.com/ReSukiSU/ReSukiSU.git KernelSU


    # ============================================================
    # Add ReSukiSU
    # ============================================================

    - name: Add ReSukiSU
      run: |
        chmod +x KernelSU/kernel/setup.sh
        KernelSU/kernel/setup.sh


    # ============================================================
    # Configure kernel
    # ============================================================

    - name: Configure kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

        make O=out ARCH=arm64 vendor/sdm845-perf_defconfig

        # --------------------------------------------------------
        # ReSukiSU
        # --------------------------------------------------------

        ./scripts/config --file out/.config --enable KSU
        ./scripts/config --file out/.config --enable KSU_MANUAL_HOOK

        # --------------------------------------------------------
        # Required symbol/config support
        # --------------------------------------------------------

        ./scripts/config --file out/.config --enable KALLSYMS
        ./scripts/config --file out/.config --enable KALLSYMS_ALL

        # --------------------------------------------------------
        # Disable KPROBES
        # --------------------------------------------------------

        ./scripts/config --file out/.config --disable KPROBES

        # --------------------------------------------------------
        # OverlayFS
        # --------------------------------------------------------

        ./scripts/config --file out/.config --enable OVERLAY_FS

        # --------------------------------------------------------
        # OnePlus charging / fuel gauge drivers
        #
        # These are required because smb-lib.c and qpnp-smb2.c
        # reference symbols implemented by these drivers.
        # --------------------------------------------------------

        ./scripts/config --file out/.config --enable ONEPLUS_FASTCHG
        ./scripts/config --file out/.config --enable FG_BQ27541

        # --------------------------------------------------------
        # ReSukiSU automatic hooks
        # --------------------------------------------------------

        ./scripts/config --file out/.config --enable KSU_MANUAL_HOOK_AUTO_ADD_TRY_UMOUNT
        ./scripts/config --file out/.config --enable KSU_MANUAL_HOOK_AUTO_ADD_SUSFS
        ./scripts/config --file out/.config --enable KSU_MANUAL_HOOK_AUTO_INITRC_HOOK

        # --------------------------------------------------------
        # Normalize configuration
        # --------------------------------------------------------

        make O=out ARCH=arm64 olddefconfig


    # ============================================================
    # Apply ReSukiSU manual hooks for Linux 4.19
    # ============================================================

    - name: Apply ReSukiSU 4.19 hooks
      run: |
        python3 <<'PY'
        from pathlib import Path

        def patch_once(path, old, new):
            p = Path(path)
            s = p.read_text()

            if new in s:
                print("[OK] already patched:", path)
                return

            if old not in s:
                raise RuntimeError("Patch target not found: " + path)

            p.write_text(s.replace(old, new, 1))
            print("[OK] patched:", path)


        # ============================================================
        # fs/stat.c
        # ============================================================

        p = Path("fs/stat.c")
        s = p.read_text()

        if "ksu_handle_stat" not in s:

            anchor = "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,"

            decl = (
                "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                "__attribute__((hot))\n"
                "extern int ksu_handle_stat(int *dfd, "
                "const char __user **filename_user, int *flags);\n"
                "extern void ksu_handle_newfstat_ret(unsigned int *fd, "
                "struct stat __user **statbuf_ptr);\n"
                "#if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)\n"
                "extern void ksu_handle_fstat64_ret(unsigned long *fd, "
                "struct stat64 __user **statbuf_ptr);\n"
                "#endif\n"
                "#endif\n\n"
            )

            if anchor not in s:
                raise RuntimeError("stat.c newfstatat anchor not found")

            s = s.replace(anchor, decl + anchor, 1)

            old = (
                "\tstruct kstat stat;\n"
                "\tint error;\n\n"
                "\terror = vfs_fstatat(dfd, filename, &stat, flag);"
            )

            new = (
                "\tstruct kstat stat;\n"
                "\tint error;\n\n"
                "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                "\tksu_handle_stat(&dfd, &filename, &flag);\n"
                "#endif\n"
                "\terror = vfs_fstatat(dfd, filename, &stat, flag);"
            )

            if old not in s:
                raise RuntimeError("stat.c newfstatat body not found")

            s = s.replace(old, new, 1)

            old = (
                "\tif (!error)\n"
                "\t\terror = cp_new_stat(&stat, statbuf);\n\n"
                "\treturn error;"
            )

            new = (
                "\tif (!error)\n"
                "\t\terror = cp_new_stat(&stat, statbuf);\n\n"
                "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                "\tksu_handle_newfstat_ret(&fd, &statbuf);\n"
                "#endif\n"
                "\treturn error;"
            )

            if old not in s:
                raise RuntimeError("stat.c newfstat body not found")

            s = s.replace(old, new, 1)

            p.write_text(s)
            print("[OK] patched: fs/stat.c")

        else:
            print("[OK] already patched: fs/stat.c")


        # ============================================================
        # fs/open.c - faccessat
        # ============================================================

        p = Path("fs/open.c")
        s = p.read_text()

        if "ksu_handle_faccessat" not in s:

            anchor = (
                "SYSCALL_DEFINE3(faccessat, int, dfd, "
                "const char __user *, filename, int, mode)"
            )

            decl = (
                "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                "__attribute__((hot))\n"
                "extern int ksu_handle_faccessat(int *dfd, "
                "const char __user **filename_user, int *mode, int *flags);\n"
                "#endif\n\n"
            )

            if anchor not in s:
                raise RuntimeError("open.c faccessat anchor not found")

            s = s.replace(anchor, decl + anchor, 1)

            old = (
                "{\n"
                "\treturn do_faccessat(dfd, filename, mode);\n"
                "}"
            )

            new = (
                "{\n"
                "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
                "#endif\n"
                "\treturn do_faccessat(dfd, filename, mode);\n"
                "}"
            )

            if old not in s:
                raise RuntimeError("open.c faccessat body not found")

            s = s.replace(old, new, 1)

            p.write_text(s)
            print("[OK] patched: fs/open.c")

        else:
            print("[OK] already patched: fs/open.c")


        # ============================================================
        # fs/exec.c - execve
        # ============================================================

        p = Path("fs/exec.c")
        s = p.read_text()

        if "ksu_handle_execveat" not in s:

            anchor = "static int do_execveat_common(int fd, struct filename *filename,"

            decl = (
                "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                "__attribute__((hot))\n"
                "extern int ksu_handle_execveat(int *fd, "
                "struct filename **filename_ptr, void *argv, "
                "void *envp, int *flags);\n"
                "#endif\n\n"
            )

            if anchor not in s:
                raise RuntimeError("exec.c do_execveat_common anchor not found")

            s = s.replace(anchor, decl + anchor, 1)

            old = (
                "{\n"
                "\treturn __do_execve_file(fd, filename, argv, envp, flags, NULL);\n"
                "}"
            )

            new = (
                "{\n"
                "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                "#endif\n"
                "\treturn __do_execve_file(fd, filename, argv, envp, flags, NULL);\n"
                "}"
            )

            if old not in s:
                raise RuntimeError("exec.c do_execveat_common body not found")

            s = s.replace(old, new, 1)

            p.write_text(s)
            print("[OK] patched: fs/exec.c")

        else:
            print("[OK] already patched: fs/exec.c")


        # ============================================================
        # fs/read_write.c - read
        # ============================================================

        p = Path("fs/read_write.c")
        s = p.read_text()

        if "ksu_handle_sys_read" not in s:

            anchor = (
                "SYSCALL_DEFINE3(read, unsigned int, fd, "
                "char __user *, buf, size_t, count)"
            )

            decl = (
                "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                "extern bool ksu_init_rc_hook __read_mostly;\n"
                "extern __attribute__((cold)) int ksu_handle_sys_read(\n"
                "\t\tunsigned int fd, char __user **buf_ptr, size_t *count_ptr);\n"
                "#endif\n\n"
            )

            if anchor not in s:
                raise RuntimeError("read_write.c read anchor not found")

            s = s.replace(anchor, decl + anchor, 1)

            old = (
                "{\n"
                "\treturn ksys_read(fd, buf, count);\n"
                "}"
            )

            new = (
                "{\n"
                "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                "\tif (unlikely(ksu_init_rc_hook))\n"
                "\t\tksu_handle_sys_read(fd, &buf, &count);\n"
                "#endif\n"
                "\treturn ksys_read(fd, buf, count);\n"
                "}"
            )

            if old not in s:
                raise RuntimeError("read_write.c read body not found")

            s = s.replace(old, new, 1)

            p.write_text(s)
            print("[OK] patched: fs/read_write.c")

        else:
            print("[OK] already patched: fs/read_write.c")


        # ============================================================
        # kernel/reboot.c - reboot
        # ============================================================

        p = Path("kernel/reboot.c")
        s = p.read_text()

        if "ksu_handle_sys_reboot" not in s:

            anchor = (
                "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, "
                "unsigned int, cmd,"
            )

            decl = (
                "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                "extern int ksu_handle_sys_reboot(int magic1, int magic2, "
                "unsigned int cmd, void __user **arg);\n"
                "#endif\n\n"
            )

            if anchor not in s:
                raise RuntimeError("reboot.c reboot anchor not found")

            s = s.replace(anchor, decl + anchor, 1)

            call_anchor = (
                "\t/* We only trust the superuser with rebooting the system. */"
            )

            call = (
                "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n"
                "#endif\n"
            )

            if call_anchor not in s:
                raise RuntimeError("reboot.c reboot body not found")

            s = s.replace(call_anchor, call + call_anchor, 1)

            p.write_text(s)
            print("[OK] patched: kernel/reboot.c")

        else:
            print("[OK] already patched: kernel/reboot.c")


        print("")
        print("========================================")
        print("ReSukiSU manual hooks completed")
        print("========================================")
        PY


    # ============================================================
    # Verify configuration
    # ============================================================

    - name: Verify configuration
      run: |
        echo "===== ReSukiSU configuration ====="

        grep -E \
          '^CONFIG_KSU=|^CONFIG_KSU_MANUAL_HOOK=|^CONFIG_KALLSYMS=|^CONFIG_KALLSYMS_ALL=|^CONFIG_KPROBES=|^CONFIG_OVERLAY_FS=|^CONFIG_ONEPLUS_FASTCHG=|^CONFIG_FG_BQ27541=' \
          out/.config


    # ============================================================
    # Check source symbols
    # ============================================================

    - name: Check missing symbols
      run: |
        echo "===== Checking missing symbols ====="

        for s in \
          switch_mode_to_normal \
          usb_sw_gpio_set \
          mcu_en_gpio_set \
          notify_dash_unplug_register \
          notify_dash_unplug_unregister \
          set_mcu_en_gpio_value \
          get_extern_fg_regist_done \
          get_extern_bq_present \
          get_prop_pre_shutdown_soc
        do
          echo
          echo "===== $s ====="
          grep -Rnw \
            --exclude-dir=.git \
            --exclude-dir=out \
            --include='*.c' \
            --include='*.h' \
            . -e "$s" || true
        done


    # ============================================================
    # Compile kernel
    # ============================================================

    - name: Compile kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

        make O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          KCFLAGS="-Wno-unused-variable" \
          -j$(nproc)


    # ============================================================
    # Save build cache
    # ============================================================

    - name: Save kernel build cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: out
        key: kernel-build-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}


    # ============================================================
    # Upload kernel
    # ============================================================

    - name: Upload kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: fajita-resukisu-kernel
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/Image.gz-dtb
