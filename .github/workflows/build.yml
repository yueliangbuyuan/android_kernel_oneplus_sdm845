name: Build ReSukiSU fajita Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    # ============================================================
    # 1. Checkout
    # ============================================================
    - name: Checkout kernel
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # ============================================================
    # 2. Install build dependencies
    # ============================================================
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc \
          bison \
          flex \
          make \
          gcc \
          g++ \
          libssl-dev \
          libelf-dev \
          python3 \
          cpio \
          rsync \
          unzip

    # ============================================================
    # 3. Android Clang
    # ============================================================
    - name: Install Android Clang
      run: |
        git clone --depth=1 \
          https://github.com/kdrag0n/proton-clang.git clang
        chmod +x clang/bin/*

    # ============================================================
    # 4. Restore kernel build cache
    # ============================================================
    - name: Restore kernel build cache
      uses: actions/cache/restore@v4
      with:
        path: out
        key: kernel-build-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          kernel-build-${{ runner.os }}-${{ github.ref_name }}-

    # ============================================================
    # 5. Clone ReSukiSU
    # ============================================================
    - name: Clone ReSukiSU
      run: |
        git clone --depth=1 \
          https://github.com/ReSukiSU/ReSukiSU.git KernelSU

    # ============================================================
    # 6. Integrate ReSukiSU
    # ============================================================
    - name: Add ReSukiSU
      run: |
        chmod +x KernelSU/kernel/setup.sh
        KernelSU/kernel/setup.sh

    # ============================================================
    # 7. Configure kernel
    # ============================================================
    - name: Configure kernel
      run: |
        make O=out ARCH=arm64 vendor/sdm845-perf_defconfig

        # --------------------------------------------------------
        # ReSukiSU
        # --------------------------------------------------------
        ./scripts/config --file out/.config --enable KSU
        ./scripts/config --file out/.config --enable KSU_MANUAL_HOOK

        # --------------------------------------------------------
        # Kernel symbols
        # --------------------------------------------------------
        ./scripts/config --file out/.config --enable KALLSYMS
        ./scripts/config --file out/.config --enable KALLSYMS_ALL

        # --------------------------------------------------------
        # ReSukiSU manual hook requirements
        # --------------------------------------------------------
        ./scripts/config --file out/.config --disable KPROBES
        ./scripts/config --file out/.config --enable OVERLAY_FS

        # --------------------------------------------------------
        # Legacy OnePlus battery drivers
        #
        # These drivers depend on missing private OnePlus/Oplus
        # symbols in this kernel tree.
        #
        # Keep them disabled so they do not break the vmlinux link.
        # --------------------------------------------------------
        ./scripts/config --file out/.config --disable ONEPLUS_FASTCHG
        ./scripts/config --file out/.config --disable FG_BQ27541

        # --------------------------------------------------------
        # ReSukiSU automatic hook options
        # --------------------------------------------------------
        ./scripts/config --file out/.config \
          --enable KSU_MANUAL_HOOK_AUTO_ADD_TRY_UMOUNT

        ./scripts/config --file out/.config \
          --enable KSU_MANUAL_HOOK_AUTO_ADD_SUSFS

        ./scripts/config --file out/.config \
          --enable KSU_MANUAL_HOOK_AUTO_INITRC_HOOK

        # --------------------------------------------------------
        # Finalize configuration
        # --------------------------------------------------------
        make O=out ARCH=arm64 olddefconfig

    # ============================================================
    # 8. Apply ReSukiSU manual hooks
    # ============================================================
    - name: Apply ReSukiSU manual hooks
      run: |
        python3 <<'PY'
        from pathlib import Path

        def patch(path, old, new):
            p = Path(path)
            s = p.read_text()

            if new in s:
                print("[OK] already patched:", path)
                return

            if old not in s:
                raise RuntimeError("Patch target not found: " + path)

            p.write_text(s.replace(old, new, 1))
            print("[OK] patched:", path)

        # --------------------------------------------------------
        # fs/stat.c
        # --------------------------------------------------------
        patch(
            "fs/stat.c",
            """SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
                struct stat __user *, statbuf, int, flag)
        {""",
            """SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
                struct stat __user *, statbuf, int, flag)
        {
            ksu_handle_stat((unsigned int)dfd, filename, statbuf);
        """
        )

        patch(
            "fs/stat.c",
            """SYSCALL_DEFINE2(stat, const char __user *, filename,
                struct stat __user *, statbuf)
        {""",
            """SYSCALL_DEFINE2(stat, const char __user *, filename,
                struct stat __user *, statbuf)
        {
            ksu_handle_stat(AT_FDCWD, filename, statbuf);
        """
        )

        # --------------------------------------------------------
        # fs/open.c
        # --------------------------------------------------------
        patch(
            "fs/open.c",
            """SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename,
                int, mode)
        {""",
            """SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename,
                int, mode)
        {
            ksu_handle_faccessat(dfd, filename, mode);
        """
        )

        # --------------------------------------------------------
        # fs/exec.c
        # --------------------------------------------------------
        patch(
            "fs/exec.c",
            """SYSCALL_DEFINE3(execve,
                const char __user *, filename,
                const char __user *const __user *, argv,
                const char __user *const __user *, envp)
        {""",
            """SYSCALL_DEFINE3(execve,
                const char __user *, filename,
                const char __user *const __user *, argv,
                const char __user *const __user *, envp)
        {
            ksu_handle_execveat(AT_FDCWD, filename, argv, envp, 0);
        """
        )

        # --------------------------------------------------------
        # fs/read_write.c
        # --------------------------------------------------------
        patch(
            "fs/read_write.c",
            """SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf,
                size_t, count)
        {""",
            """SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf,
                size_t, count)
        {
            ksu_handle_sys_read(fd, buf, count);
        """
        )

        # --------------------------------------------------------
        # kernel/reboot.c
        # --------------------------------------------------------
        patch(
            "kernel/reboot.c",
            """SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
                void __user *, arg)
        {""",
            """SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
                void __user *, arg)
        {
            ksu_handle_sys_reboot(cmd);
        """
        )

        print("===== ReSukiSU hooks finished =====")
        PY

    # ============================================================
    # 9. Verify kernel configuration
    # ============================================================
    - name: Verify kernel configuration
      run: |
        echo "===== ReSukiSU CONFIG ====="

        grep -E \
          'CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=' \
          out/.config || true

        echo
        echo "===== Legacy OnePlus battery CONFIG ====="

        grep -E \
          'CONFIG_ONEPLUS_FASTCHG=|CONFIG_FG_BQ27541=' \
          out/.config || true

        echo
        echo "===== ReSukiSU related CONFIG ====="

        grep -E \
          'CONFIG_KPROBES=|CONFIG_OVERLAY_FS=' \
          out/.config || true

    # ============================================================
    # 10. Build kernel
    # ============================================================
    - name: Build kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

        make O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          KCFLAGS="-Wno-unused-variable" \
          -j$(nproc)

    # ============================================================
    # 11. Save kernel build cache
    # ============================================================
    - name: Save kernel build cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: out
        key: kernel-build-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

    # ============================================================
    # 12. Upload kernel
    # ============================================================
    - name: Upload kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: fajita-resukisu-kernel
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/Image.gz-dtb
