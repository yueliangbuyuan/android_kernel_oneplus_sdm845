name: Build ReSukiSU fajita Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # 1. Checkout OnePlus 6T kernel
      # ============================================================
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: yueliangbuyuan/android_kernel_oneplus_sdm845
          ref: lineage-23.2-4.19
          fetch-depth: 1

      # ============================================================
      # 2. Install build dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            rsync \
            wget \
            xz-utils

      # ============================================================
      # 3. Install Android/Proton Clang
      # ============================================================
      - name: Install Android Clang
        run: |
          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang.git \
            clang

          chmod +x clang/bin/*

          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

          echo "===== Clang version ====="
          clang --version
          echo "========================="

      # ============================================================
      # 4. Cache kernel build
      # ============================================================
      - name: Cache kernel build
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
          key: kernel-ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            kernel-ccache-${{ runner.os }}-

      # ============================================================
      # 5. Clone ReSukiSU
      # ============================================================
      - name: Clone ReSukiSU
        run: |
          git clone --depth=1 \
            https://github.com/ReSukiSU/ReSukiSU.git \
            KernelSU

      # ============================================================
      # 6. Add ReSukiSU to kernel
      # ============================================================
      - name: Add ReSukiSU
        run: |
          chmod +x KernelSU/kernel/setup.sh
          KernelSU/kernel/setup.sh

      # ============================================================
      # 7. Official ReSukiSU Manual Integrate hooks
      #
      # Kernel version: 4.19
      #
      # Required:
      #   stat
      #   newfstat
      #   fstat64
      #   execveat + post_execveat
      #   faccessat
      #   reboot
      #   sys_read
      #
      # ReSukiSU current interface:
      #   ksu_init_rc_hook
      #
      # DO NOT use:
      #   ksu_vfs_read_hook
      # ============================================================
      - name: Apply official ReSukiSU Manual Integrate hooks
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def require(path, needle):
              text = read(path)
              if needle not in text:
                  raise RuntimeError(
                      f"Required target not found in {path}: {needle}"
                  )
              return text

          def insert_before(path, marker, addition, tag):
              text = read(path)

              if tag in text:
                  print(f"[SKIP] {path}: {tag} already present")
                  return

              if marker not in text:
                  raise RuntimeError(
                      f"Patch target not found in {path}: {marker}"
                  )

              text = text.replace(
                  marker,
                  addition + "\n" + marker,
                  1
              )

              write(path, text)
              print(f"[OK] {path}: {tag}")

          def insert_after(path, marker, addition, tag):
              text = read(path)

              if tag in text:
                  print(f"[SKIP] {path}: {tag} already present")
                  return

              if marker not in text:
                  raise RuntimeError(
                      f"Patch target not found in {path}: {marker}"
                  )

              text = text.replace(
                  marker,
                  marker + addition,
                  1
              )

              write(path, text)
              print(f"[OK] {path}: {tag}")

          # ==========================================================
          # fs/stat.c
          # ==========================================================

          stat_path = "fs/stat.c"
          stat = require(
              stat_path,
              "SYSCALL_DEFINE4(newfstatat"
          )

          STAT_EXTERN = r'''
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd,
                                     const char __user **filename_user,
                                     int *flags);

          extern void ksu_handle_newfstat_ret(
              unsigned int *fd,
              struct stat __user **statbuf_ptr);

          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(
              unsigned long *fd,
              struct stat64 __user **statbuf_ptr);
          #endif
          #endif
          '''

          if "ksu_handle_stat" not in stat:
              marker = "#if !defined(__ARCH_WANT_STAT64)"
              if marker not in stat:
                  raise RuntimeError(
                      "Cannot find stat.c insertion point"
                  )

              stat = stat.replace(
                  marker,
                  STAT_EXTERN + "\n" + marker,
                  1
              )

          # ----------------------------------------------------------
          # newfstatat
          # ----------------------------------------------------------
          if "ksu_handle_stat(&dfd, &filename, &flag);" not in stat:
              pattern = (
                  r"(SYSCALL_DEFINE4\(newfstatat.*?"
                  r"\n\})"
              )

              match = re.search(
                  pattern,
                  stat,
                  re.S
              )

              if not match:
                  raise RuntimeError(
                      "Cannot locate newfstatat() body"
                  )

              block = match.group(1)

              target = "error = vfs_fstatat(dfd, filename, &stat, flag);"

              if target not in block:
                  raise RuntimeError(
                      "Cannot locate newfstatat vfs_fstatat()"
                  )

              block = block.replace(
                  target,
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tksu_handle_stat(&dfd, &filename, &flag);\n"
                  "#endif\n"
                  "\t" + target,
                  1
              )

              stat = (
                  stat[:match.start(1)] +
                  block +
                  stat[match.end(1):]
              )

          # ----------------------------------------------------------
          # fstatat64
          # ----------------------------------------------------------
          if (
              "ksu_handle_stat(&dfd, &filename, &flag);" not in
              stat[stat.find("SYSCALL_DEFINE4(fstatat64"):]
          ):
              pos = stat.find("SYSCALL_DEFINE4(fstatat64")

              if pos != -1:
                  end = stat.find("\n}", pos)

                  if end == -1:
                      raise RuntimeError(
                          "Cannot locate fstatat64() body"
                      )

                  block = stat[pos:end + 2]

                  target = (
                      "error = vfs_fstatat("
                      "dfd, filename, &stat, flag);"
                  )

                  if target in block:
                      block = block.replace(
                          target,
                          "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                          "\tksu_handle_stat(&dfd, &filename, &flag);\n"
                          "#endif\n"
                          "\t" + target,
                          1
                      )

                      stat = (
                          stat[:pos] +
                          block +
                          stat[end + 2:]
                      )

          # ----------------------------------------------------------
          # newfstat return hook
          # ----------------------------------------------------------
          if "ksu_handle_newfstat_ret" not in stat:
              raise RuntimeError(
                  "ksu_handle_newfstat_ret declaration missing"
              )

          if (
              stat.count("ksu_handle_newfstat_ret(&fd, &statbuf);") == 0
          ):
              pos = stat.find(
                  "SYSCALL_DEFINE2(newfstat"
              )

              if pos == -1:
                  raise RuntimeError(
                      "Cannot locate newfstat()"
                  )

              end = stat.find("\n}", pos)

              if end == -1:
                  raise RuntimeError(
                      "Cannot locate end of newfstat()"
                  )

              block = stat[pos:end + 2]

              target = "\treturn error;"

              if target not in block:
                  raise RuntimeError(
                      "Cannot locate newfstat return"
                  )

              block = block.replace(
                  target,
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tksu_handle_newfstat_ret(&fd, &statbuf);\n"
                  "#endif\n"
                  "\treturn error;",
                  1
              )

              stat = (
                  stat[:pos] +
                  block +
                  stat[end + 2:]
              )

          # ----------------------------------------------------------
          # fstat64 return hook
          # ----------------------------------------------------------
          if "ksu_handle_fstat64_ret(&fd, &statbuf);" not in stat:
              pos = stat.find(
                  "SYSCALL_DEFINE2(fstat64"
              )

              if pos == -1:
                  raise RuntimeError(
                      "Cannot locate fstat64()"
                  )

              end = stat.find("\n}", pos)

              if end == -1:
                  raise RuntimeError(
                      "Cannot locate end of fstat64()"
                  )

              block = stat[pos:end + 2]

              target = "\treturn error;"

              if target not in block:
                  raise RuntimeError(
                      "Cannot locate fstat64 return"
                  )

              block = block.replace(
                  target,
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tksu_handle_fstat64_ret(&fd, &statbuf);\n"
                  "#endif\n"
                  "\treturn error;",
                  1
              )

              stat = (
                  stat[:pos] +
                  block +
                  stat[end + 2:]
              )

          write(stat_path, stat)
          print("[OK] fs/stat.c")

          # ==========================================================
          # fs/exec.c
          #
          # Linux 4.19 = 3.14+ interface
          #
          # Current official interface:
          #   ksu_handle_execveat
          #   ksu_handle_post_execveat
          # ==========================================================

          exec_path = "fs/exec.c"
          exec = require(
              exec_path,
              "static int do_execveat_common"
          )

          EXEC_EXTERN = r'''
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_execveat(
              int *fd,
              struct filename **filename_ptr,
              void *argv,
              void *envp,
              int *flags);

          __attribute__((hot))
          extern int ksu_handle_post_execveat(
              int *fd,
              struct filename **filename_ptr,
              void *argv,
              void *envp,
              int *flags,
              int *retval);
          #endif
          '''

          if "ksu_handle_execveat" not in exec:
              marker = "static int do_execveat_common"
              exec = exec.replace(
                  marker,
                  EXEC_EXTERN + "\n" + marker,
                  1
              )

          # Patch the actual do_execveat_common return.
          if "ksu_handle_post_execveat" not in exec:
              marker = (
                  "static int do_execveat_common"
              )

              pos = exec.find(marker)
              end = exec.find("\n}", pos)

              if pos == -1 or end == -1:
                  raise RuntimeError(
                      "Cannot locate do_execveat_common()"
                  )

              block = exec[pos:end + 2]

              target = (
                  "\treturn __do_execve_file("
                  "fd, filename, argv, envp, flags, NULL);"
              )

              if target not in block:
                  raise RuntimeError(
                      "Cannot locate do_execveat_common() return"
                  )

              replacement = r'''
          #ifdef CONFIG_KSU_MANUAL_HOOK
          	int retval;

          	ksu_handle_execveat(
          		&fd,
          		&filename,
          		&argv,
          		&envp,
          		&flags);

          	retval = __do_execve_file(
          		fd,
          		filename,
          		argv,
          		envp,
          		flags,
          		NULL);

          	ksu_handle_post_execveat(
          		&fd,
          		&filename,
          		&argv,
          		&envp,
          		&flags,
          		&retval);

          	return retval;
          #else
          	return __do_execve_file(
          		fd,
          		filename,
          		argv,
          		envp,
          		flags,
          		NULL);
          #endif'''

              block = block.replace(
                  target,
                  replacement,
                  1
              )

              exec = (
                  exec[:pos] +
                  block +
                  exec[end + 2:]
              )

          write(exec_path, exec)
          print("[OK] fs/exec.c")

          # ==========================================================
          # fs/open.c
          # ==========================================================

          open_path = "fs/open.c"
          op = require(
              open_path,
              "SYSCALL_DEFINE3(faccessat"
          )

          OPEN_EXTERN = r'''
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_faccessat(
              int *dfd,
              const char __user **filename_user,
              int *mode,
              int *flags);
          #endif
          '''

          if "ksu_handle_faccessat" not in op:
              marker = "SYSCALL_DEFINE3(faccessat"
              op = op.replace(
                  marker,
                  OPEN_EXTERN + "\n" + marker,
                  1
              )

          if "ksu_handle_faccessat(&dfd, &filename, &mode, NULL);" not in op:
              marker = (
                  "SYSCALL_DEFINE3("
                  "faccessat, int, dfd, "
                  "const char __user *, filename, int, mode)"
              )

              pos = op.find(marker)

              if pos == -1:
                  raise RuntimeError(
                      "Cannot locate faccessat()"
                  )

              brace = op.find("{", pos)

              if brace == -1:
                  raise RuntimeError(
                      "Cannot locate faccessat() opening brace"
                  )

              insert = r'''
          #ifdef CONFIG_KSU_MANUAL_HOOK
          	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif
          '''

              op = (
                  op[:brace + 1] +
                  insert +
                  op[brace + 1:]
              )

          write(open_path, op)
          print("[OK] fs/open.c")

          # ==========================================================
          # kernel/reboot.c
          # ==========================================================

          reboot_path = "kernel/reboot.c"
          reboot = require(
              reboot_path,
              "SYSCALL_DEFINE4(reboot"
          )

          REBOOT_EXTERN = r'''
          #ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_sys_reboot(
              int magic1,
              int magic2,
              unsigned int cmd,
              void __user **arg);
          #endif
          '''

          if "ksu_handle_sys_reboot" not in reboot:
              marker = "SYSCALL_DEFINE4(reboot"
              reboot = reboot.replace(
                  marker,
                  REBOOT_EXTERN + "\n" + marker,
                  1
              )

          if "ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);" not in reboot:
              pos = reboot.find(
                  "SYSCALL_DEFINE4(reboot"
              )

              end = reboot.find("\n}", pos)

              if pos == -1 or end == -1:
                  raise RuntimeError(
                      "Cannot locate reboot()"
                  )

              block = reboot[pos:end + 2]

              target = "\tint ret = 0;"

              if target not in block:
                  raise RuntimeError(
                      "Cannot locate reboot ret declaration"
                  )

              block = block.replace(
                  target,
                  target +
                  "\n\n"
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tksu_handle_sys_reboot("
                  "magic1, magic2, cmd, &arg);\n"
                  "#endif",
                  1
              )

              reboot = (
                  reboot[:pos] +
                  block +
                  reboot[end + 2:]
              )

          write(reboot_path, reboot)
          print("[OK] kernel/reboot.c")

          # ==========================================================
          # fs/read_write.c
          #
          # IMPORTANT:
          # Current ReSukiSU uses ksu_init_rc_hook.
          #
          # ksu_vfs_read_hook is deliberately forbidden.
          # ==========================================================

          read_path = "fs/read_write.c"
          rw = require(
              read_path,
              "SYSCALL_DEFINE3(read, unsigned int, fd"
          )

          if "ksu_vfs_read_hook" in rw:
              raise RuntimeError(
                  "OLD ksu_vfs_read_hook already exists in "
                  "fs/read_write.c"
              )

          READ_EXTERN = r'''
          #ifdef CONFIG_KSU_MANUAL_HOOK
          extern bool ksu_init_rc_hook __read_mostly;
          extern __attribute__((cold)) int ksu_handle_sys_read(
              unsigned int fd,
              char __user **buf_ptr,
              size_t *count_ptr);
          #endif
          '''

          if "ksu_init_rc_hook" not in rw:
              marker = (
                  "SYSCALL_DEFINE3("
                  "read, unsigned int, fd"
              )

              rw = rw.replace(
                  marker,
                  READ_EXTERN + "\n" + marker,
                  1
              )

          if "ksu_handle_sys_read(fd, &buf, &count);" not in rw:
              marker = (
                  "SYSCALL_DEFINE3("
                  "read, unsigned int, fd"
              )

              pos = rw.find(marker)

              if pos == -1:
                  raise RuntimeError(
                      "Cannot locate read()"
                  )

              brace = rw.find("{", pos)

              if brace == -1:
                  raise RuntimeError(
                      "Cannot locate read() opening brace"
                  )

              insert = r'''
          #ifdef CONFIG_KSU_MANUAL_HOOK
          	if (unlikely(ksu_init_rc_hook))
          		ksu_handle_sys_read(fd, &buf, &count);
          #endif
          '''

              rw = (
                  rw[:brace + 1] +
                  insert +
                  rw[brace + 1:]
              )

          write(read_path, rw)
          print("[OK] fs/read_write.c")

          # ==========================================================
          # Final sanity check
          # ==========================================================

          checks = {
              "fs/stat.c": [
                  "ksu_handle_stat",
                  "ksu_handle_newfstat_ret",
                  "ksu_handle_fstat64_ret",
              ],
              "fs/exec.c": [
                  "ksu_handle_execveat",
                  "ksu_handle_post_execveat",
              ],
              "fs/open.c": [
                  "ksu_handle_faccessat",
              ],
              "kernel/reboot.c": [
                  "ksu_handle_sys_reboot",
              ],
              "fs/read_write.c": [
                  "ksu_init_rc_hook",
                  "ksu_handle_sys_read",
              ],
          }

          for path, symbols in checks.items():
              text = read(path)

              for symbol in symbols:
                  if symbol not in text:
                      raise RuntimeError(
                          f"[FAIL] {path}: missing {symbol}"
                      )

          # Absolutely forbid the obsolete hook.
          for path in [
              "fs/read_write.c",
              "fs/stat.c",
              "fs/exec.c",
              "fs/open.c",
              "kernel/reboot.c",
          ]:
              text = read(path)

              if "ksu_vfs_read_hook" in text:
                  raise RuntimeError(
                      f"[FAIL] obsolete ksu_vfs_read_hook "
                      f"still exists in {path}"
                  )

          print()
          print("==============================================")
          print(" ReSukiSU Manual Integrate patch: SUCCESS")
          print("==============================================")
          PY

      # ============================================================
      # 8. Configure kernel
      # ============================================================
      - name: Configure kernel
        run: |
          set -e

          make O=out ARCH=arm64 vendor/sdm845-perf_defconfig

          ./scripts/config --file out/.config \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --disable KPROBES \
            --enable OVERLAY_FS \
            --disable ONEPLUS_FASTCHG \
            --disable FG_BQ27541

          # Current ReSukiSU checker:
          #
          # setuid:
          #   use LSM automatic hook on 4.19
          #
          # input:
          #   use automatic input handler hook
          #
          # init rc:
          #   MANUAL hook is required here because we are
          #   deliberately using ksu_init_rc_hook in read().
          #
          ./scripts/config --file out/.config \
            --enable KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
            --enable KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
            --disable KSU_MANUAL_HOOK_AUTO_INITRC_HOOK

          # Keep try_umount automatic.
          ./scripts/config --file out/.config \
            --enable KSU_MANUAL_HOOK_AUTO_ADD_TRY_UMOUNT

          # SUSFS is NOT enabled here.
          #
          # ReSukiSU's current documentation states that SUSFS is
          # not out-of-box supported for Non-GKI kernels and requires
          # manual backporting.
          ./scripts/config --file out/.config \
            --disable KSU_MANUAL_HOOK_AUTO_ADD_SUSFS

          make O=out ARCH=arm64 olddefconfig

          echo
          echo "===== ReSukiSU config ====="
          grep -E \
            '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_MANUAL_HOOK_AUTO_|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=)' \
            out/.config || true

          echo
          echo "===== Battery legacy drivers ====="
          grep -E \
            '^(CONFIG_ONEPLUS_FASTCHG|CONFIG_FG_BQ27541)' \
            out/.config || true

      # ============================================================
      # 9. Verify hooks BEFORE starting the long kernel build
      # ============================================================
      - name: Verify ReSukiSU hooks
        run: |
          set -e

          echo "===== ReSukiSU hook verification ====="

          echo
          echo "--- stat ---"
          grep -n \
            "ksu_handle_stat\|ksu_handle_newfstat_ret\|ksu_handle_fstat64_ret" \
            fs/stat.c

          echo
          echo "--- exec ---"
          grep -n \
            "ksu_handle_execveat\|ksu_handle_post_execveat" \
            fs/exec.c

          echo
          echo "--- faccessat ---"
          grep -n \
            "ksu_handle_faccessat" \
            fs/open.c

          echo
          echo "--- reboot ---"
          grep -n \
            "ksu_handle_sys_reboot" \
            kernel/reboot.c

          echo
          echo "--- read ---"
          grep -n \
            "ksu_init_rc_hook\|ksu_handle_sys_read" \
            fs/read_write.c

          echo
          echo "--- forbidden old read hook ---"
          if grep -R \
            "ksu_vfs_read_hook" \
            fs/read_write.c \
            fs/stat.c \
            fs/exec.c \
            fs/open.c \
            kernel/reboot.c; then
            echo "ERROR: obsolete ksu_vfs_read_hook found"
            exit 1
          fi

          echo
          echo "===== Hook verification PASSED ====="

      # ============================================================
      # 10. Build kernel
      # ============================================================
      - name: Build kernel
        env:
          KCFLAGS: "-Wno-unused-variable"
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          echo "===== Compiler ====="
          clang --version

          echo
          echo "===== Kernel build ====="

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="$KCFLAGS" \
            Image \
            Image.gz \
            modules

      # ============================================================
      # 11. Verify build output
      # ============================================================
      - name: Verify build output
        run: |
          set -e

          echo "===== Build output ====="

          ls -lh \
            out/arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.gz \
            out/.config

          echo
          echo "===== Kernel version ====="
          make -s O=out ARCH=arm64 kernelversion

          echo
          echo "===== ReSukiSU config ====="
          grep -E \
            '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=)' \
            out/.config

      # ============================================================
      # 12. Package artifacts
      # ============================================================
      - name: Package kernel
        run: |
          set -e

          mkdir -p release

          cp out/arch/arm64/boot/Image \
            release/Image

          cp out/arch/arm64/boot/Image.gz \
            release/Image.gz

          cp out/.config \
            release/kernel.config

          echo "ReSukiSU fajita kernel" \
            > release/README.txt

          echo "Kernel: Linux 4.19" \
            >> release/README.txt

          echo "Device: OnePlus 6T (fajita)" \
            >> release/README.txt

          echo "CONFIG_KSU=y" \
            >> release/README.txt

          echo "CONFIG_KSU_MANUAL_HOOK=y" \
            >> release/README.txt

          tar -czf \
            ReSukiSU-fajita-kernel.tar.gz \
            -C release \
            Image \
            Image.gz \
            kernel.config \
            README.txt

          ls -lh \
            release/* \
            ReSukiSU-fajita-kernel.tar.gz

      # ============================================================
      # 13. Upload kernel
      # ============================================================
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-fajita-kernel
          path: |
            ReSukiSU-fajita-kernel.tar.gz
            release/Image
            release/Image.gz
            release/kernel.config
            release/README.txt
          if-no-files-found: error
