name: Build ReSukiSU SUSFS fajita Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget \
            patch

      - name: Check kernel tree
        run: |
          echo "===== Kernel ====="
          git rev-parse HEAD
          git log -1 --oneline

          echo
          echo "===== Required files ====="
          test -f arch/arm64/configs/vendor/sdm845-perf_defconfig
          test -d drivers
          test -d fs

      - name: Check OnePlus private driver symbols
        run: |
          echo "===== Checking OnePlus power symbols ====="

          grep -R \
            -n \
            -E \
            'switch_mode_to_normal|usb_sw_gpio_set|mcu_en_gpio_set|get_extern_fg_regist_done|get_extern_bq_present|get_prop_pre_shutdown_soc' \
            drivers include \
            | head -100 || true

      - name: Add ReSukiSU
        run: |
          rm -rf KernelSU

          git clone \
            https://github.com/ReSukiSU/ReSukiSU.git \
            KernelSU

          cd KernelSU

          # The successful reference kernel used ReSukiSU v4.1.x.
          git fetch --tags --force

          if git cat-file -e 90b4a4c7^{commit}; then
            git checkout 90b4a4c7
          else
            echo "WARNING: 90b4a4c7 is not directly available."
            echo "Using current ReSukiSU source instead."
          fi

          echo
          echo "===== ReSukiSU commit ====="
          git log -1 --oneline

      - name: Integrate ReSukiSU
        run: |
          chmod +x KernelSU/kernel/setup.sh
          KernelSU/kernel/setup.sh

      - name: Apply SUSFS 2.3.0 kernel patch
        run: |
          wget -O susfs_4.19.patch \
            https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.19.patch

          echo "===== SUSFS patch ====="
          head -20 susfs_4.19.patch

          patch -p1 --forward --batch < susfs_4.19.patch

      - name: Apply SUSFS Inline Hook
        run: |
          wget -O susfs_inline_hook_patches.sh \
            https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh

          chmod +x susfs_inline_hook_patches.sh

          echo "===== SUSFS Inline Hook ====="
          bash susfs_inline_hook_patches.sh

      - name: Configure kernel
        run: |
          mkdir -p out

          make O=out ARCH=arm64 \
            vendor/sdm845-perf_defconfig

          ./scripts/config --file out/.config \
            --enable KSU \
            --enable KSU_SUSFS \
            --disable KSU_MANUAL_HOOK \
            --disable KSU_TRACEPOINT_HOOK \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --disable KPROBES \
            --enable OVERLAY_FS

          # OnePlus 6/6T private power drivers.
          ./scripts/config --file out/.config \
            --enable ONEPLUS_FASTCHG \
            --enable FG_BQ27541

          # SUSFS 2.3 features.
          ./scripts/config --file out/.config \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SUS_MAP

          # Match the known successful kernel configuration:
          # LTO disabled.
          ./scripts/config --file out/.config \
            --enable LTO_NONE \
            --disable LTO_CLANG \
            --disable THINLTO \
            --disable CFI_CLANG \
            --disable CFI_CLANG_SHADOW \
            --disable SHADOW_CALL_STACK

          make O=out ARCH=arm64 olddefconfig

          echo
          echo "===== FINAL CONFIG ====="

          grep -E \
            'CONFIG_(KSU|KSU_SUSFS|ONEPLUS_FASTCHG|FG_BQ27541|LTO|THINLTO|CFI_CLANG|SHADOW_CALL_STACK|KALLSYMS|KPROBES|OVERLAY_FS)' \
            out/.config || true

      - name: Install Clang 22.1.8
        run: |
          git clone --depth=1 \
            https://github.com/llvm/llvm-project.git \
            llvm-project

          cd llvm-project

          git fetch --depth=1 \
            https://github.com/llvm/llvm-project.git \
            llvmorg-22.1.8

          git checkout llvmorg-22.1.8

          cmake -S llvm -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;X86"

          cmake --build build \
            --target clang lld \
            -j"$(nproc)"

      - name: Build kernel
        env:
          KCFLAGS: -Wno-unused-variable
        run: |
          export LLVM="$GITHUB_WORKSPACE/llvm-project/build/bin/"
          export LLVM_IAS=1

          echo "===== CLANG ====="
          "$LLVM/clang" --version

          echo
          echo "===== LLD ====="
          "$LLVM/ld.lld" --version

          echo
          echo "===== BUILD ====="

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM="$LLVM" \
            LLVM_IAS=1 \
            KCFLAGS="$KCFLAGS" \
            Image.gz-dtb

      - name: Verify result
        run: |
          set -e

          test -f out/arch/arm64/boot/Image.gz-dtb

          echo "======================================"
          echo "BUILD SUCCESS"
          echo "======================================"

          ls -lh out/arch/arm64/boot/Image.gz-dtb

          echo
          echo "===== CONFIG CHECK ====="

          grep -E \
            'CONFIG_(KSU=|KSU_SUSFS=|KSU_MANUAL_HOOK|KSU_TRACEPOINT_HOOK|ONEPLUS_FASTCHG|FG_BQ27541|LTO_NONE|LTO_CLANG|THINLTO|CFI_CLANG)' \
            out/.config || true

          echo
          echo "===== KERNEL STRING ====="

          strings \
            out/arch/arm64/boot/Image.gz-dtb \
            | grep -E \
              'Linux version|ReSukiSU|SUSFS|clang version' \
            | head -50 || true

      - name: Package
        run: |
          mkdir -p release

          cp \
            out/arch/arm64/boot/Image.gz-dtb \
            release/Image.gz-dtb

          cp \
            out/.config \
            release/kernel.config

          cat > release/README.txt <<'EOF'
          OnePlus 6T fajita

          Kernel:
          Linux 4.19.325

          Root:
          ReSukiSU

          SUSFS:
          SUSFS 2.3.x Inline Hook

          Output:
          Image.gz-dtb

          Device:
          fajita / enchilada
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-SUSFS-fajita
          path: release/
          if-no-files-found: error
